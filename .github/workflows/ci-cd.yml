name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 🔧빌드
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트(H2)까지 돌린 뒤 실행용 jar(build/libs/eventor-back.jar)를 만든다
      - name: Build with Gradle
        run: ./gradlew build

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # 지금 떠 있는 색의 반대 색으로 이미지를 만든다.
      # 버전 확인 주소: 새 버전 /api/actuator/version, 컷오버 전 구버전 /back/actuator/version
      - name: Build and Push Docker image
        run: |
          cd .github/docker
          RUNNING=$(curl -s --max-time 10 https://eventor.duckdns.org/api/actuator/version || true)
          if [ "$RUNNING" != "blue" ] && [ "$RUNNING" != "green" ]; then
            RUNNING=$(curl -s --max-time 10 https://eventor.duckdns.org/back/actuator/version || true)
          fi
          echo "현재 실행 중: $RUNNING"
          if [ "$RUNNING" == "blue" ]; then
            docker compose -f compose.green-build.yml build
            docker compose -f compose.green-build.yml push
          else
            docker compose -f compose.blue-build.yml build
            docker compose -f compose.blue-build.yml push
          fi

  server:
    name: 🚀배포
    runs-on: ubuntu-latest
    needs: build
    steps:
      # ENV_FILE 시크릿이 비어 있으면 서버의 .env를 빈 파일로 덮어쓰게 되므로 배포를 멈춘다
      - name: Write .env file to temporary file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ENV_FILE 시크릿이 비어 있습니다"; exit 1
          fi
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Send .env to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env"
          target: "/home/ubuntu/eventor"

      # 블루/그린 전환은 서버의 deploy.sh 가 맡는다(새 색 컨테이너 기동 → 헬스 확인 → nginx upstream 전환 → 이전 색 종료)
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd eventor/eventor-back
            source deploy.sh
