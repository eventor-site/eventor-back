# 공통 설정. 프로필을 주지 않으면 dev(로컬)로 뜬다. 운영 컨테이너는 -Dspring.profiles.active=prod
spring:
  application:
    name: eventor-back
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다(src/main/resources/db/migration). 로컬은 validate로 엔티티와 DB 차이를 시작 시 알린다
      ddl-auto: none
    properties:
      hibernate:
        auto_quote_keyword: true # 예약어 컬럼(group 등)

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전부터 있던 DB(eventor, eventor_dev)는 V1(기준선)을 건너뛰고 V2부터 적용한다. 빈 DB는 V1부터
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL_USERNAME:}
    password: ${GOOGLE_EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

server:
  # 로컬: 프론트 개발 서버(9080)가 /api, /uploads 를 이 포트로 넘긴다. 운영 포트는 application-prod.yml
  port: ${SERVER_PORT:9081}
  # nginx·Vite 프록시가 넘겨주는 X-Forwarded-* 로 원래 주소(https, 도메인)를 알아낸다(구글 콜백 주소, sitemap 주소)
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

eventor:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 10m
    refresh-ttl: 7d
  cookie:
    secure: false
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  gemini:
    # Google AI Studio 무료 등급 키(이벤터 전용 프로젝트). 무료 등급은 입력이 Google 제품 개선에 쓰이므로 공개된 글만 보낸다
    api-key: ${GEMINI_API_KEY:}
    # 무료 등급 한도(2026-11): 3.5 Flash-Lite 10 RPM·250K TPM·500 RPD, 3.8 Flash 5 RPM·20 RPD. 한도는 프로젝트 단위
    bulk-model: ${GEMINI_BULK_MODEL:gemini-3.5-flash-lite}
    quality-model: ${GEMINI_QUALITY_MODEL:gemini-3.8-flash}
    timeout: 90s
    jobs-enabled: ${GEMINI_JOBS_ENABLED:true}
    # 이벤터 몫: 무료 한도의 40%. 같은 프로젝트를 다른 서비스와 나눠 써도 여유가 남도록
    budgets:
      "[gemini-3.5-flash-lite]": { rpm: 4, rpd: 200 }
      "[gemini-3.8-flash]": { rpm: 2, rpd: 8 }
  storage:
    # 업로드 저장 루트(작업 폴더 기준). 로컬·운영 같은 값, 운영 컨테이너는 이 폴더를 마운트한다
    root: ./uploads
    # 로컬에 없는 파일을 읽어 올 사이트(로컬 개발 전용). 비우면 끈다
    fallback-base-url: ""
  web:
    # 프론트 빌드 index.html(작업 폴더 기준). 운영 컨테이너는 프론트 releases 폴더를 ./web 에 읽기 전용으로 마운트한다
    index-file: ./web/index.html
    index-url: ""

openApi:
  tour: ${TOUR_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    path: ./logs
  level:
    io.github.bonigarcia.wdm.WebDriverManager: ERROR
    org.openqa.selenium.devtools.CdpVersionFinder: ERROR
    org.openqa.selenium.chromium.ChromiumDriver: ERROR
