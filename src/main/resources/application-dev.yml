# 로컬 개발(기본 프로필). 비밀값은 git에 올리지 않는 src/main/resources/application.env 에 적는다.
spring:
  config:
    import: optional:file:./src/main/resources/application.env[.properties]

  # 개발 DB: 운영 서버의 eventor_dev(운영 eventor 복제본, scripts/clone-prod-to-dev.sh)
  datasource:
    url: ${DEV_MYSQL_URL}

  jpa:
    hibernate:
      ddl-auto: validate

eventor:
  storage:
    # 로컬 DB는 운영 복제본이라 이미지 파일은 운영 서버에만 있다. 로컬에 없으면 운영에서 읽는다
    fallback-base-url: https://eventor.duckdns.org
  web:
    # 로컬은 프론트 빌드 파일이 없으니 Vite 개발 서버에서 index.html 을 받는다
    index-url: http://localhost:9080/
