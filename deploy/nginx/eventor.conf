# ===============================================
# eventor (eventor.duckdns.org) — 2026-11 마이그레이션 이후
#   - 프론트: 정적 파일(React 빌드) /var/www/eventor/releases
#   - 이미지: 공용 이미지 폴더 /image/postimage (호스트 /home/ubuntu/image/postimage, 백엔드가 쓰고 nginx 가 바로 서빙)
#   - API·SEO 페이지·사이트맵: 백엔드(블루/그린 upstream)
# nginx 컨테이너 볼륨(서버 /home/ubuntu/docker-compose 기준, 바꿀 것 없음):
#   - ./content:/var/www                     → /home/ubuntu/content/eventor/releases 가 /var/www/eventor/releases
#   - ./image/postimage:/image/postimage     → 공용 이미지 폴더
# 이 파일의 server 블록 두 개는 nginx/sites-available/default 안의 기존 eventor 블록을 바꾼다(다른 사이트 블록은 그대로).
# $bad_bot, $blocked_query 맵과 upstream 파일은 기존 것을 그대로 쓴다.
# ===============================================

server {
    listen 80;
    server_name eventor.duckdns.org;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location / {
        if ($bad_bot) { return 403; }
        if ($blocked_query) { return 403; }
        return 301 https://$host$request_uri;
    }
}

include /nginx/eventor-backend_upstream.conf;

server {
    listen 443 ssl;
    server_name eventor.duckdns.org;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/eventor.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventor.duckdns.org/privkey.pem;

    root /var/www/eventor/releases;

    if ($bad_bot) { return 403; }
    if ($blocked_query) { return 403; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # ---------- 백엔드 공통 프록시 설정 ----------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 502 503 504 /nErrors/502.html;
    error_page 413 /nErrors/413.html;

    location /nErrors/ {
        root /usr/share/nginx/html/;
        internal;
    }

    location /nImages/ {
        root /usr/share/nginx/html/;
    }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://eventor-backend_upstream;
    }

    # ---------- 검색엔진용 HTML·사이트맵(백엔드가 index.html 에 제목·본문을 넣어 응답) ----------
    location ~ ^/posts/[0-9]+/?$ {
        proxy_pass http://eventor-backend_upstream;
    }

    location = /posts {
        proxy_pass http://eventor-backend_upstream;
    }

    location = /sitemap.xml {
        proxy_pass http://eventor-backend_upstream;
    }

    location /sitemaps/ {
        proxy_pass http://eventor-backend_upstream;
    }

    # ---------- 업로드 이미지(공용 이미지 폴더 /image 를 그대로 서빙) ----------
    # 새 주소: /uploads/postimage/20260101/a.webp → /image/postimage/20260101/a.webp
    location /uploads/ {
        alias /image/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 옛 주소(외부에 퍼진 링크·검색엔진 이미지 색인)도 같은 파일을 바로 서빙(이동 없이)
    location /postimage/ {
        root /image/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # 옛 API 주소는 더 쓰지 않는다
    location /back/ {
        return 410;
    }

    # ---------- 프론트 정적 파일 ----------
    # 해시가 붙은 빌드 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 그 밖의 주소는 React 가 처리(index.html). index.html 은 캐시하지 않아 배포가 바로 반영된다
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------- 기존 서비스(변경 없음) ----------
    location /trip {
        alias /usr/share/nginx/html/trip/;
        index index.html;
        add_header Cache-Control "no-store" always;
    }

    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
    }
}
